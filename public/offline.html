<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D4ED8" />
    <title>لا يوجد اتصال - درة المنورة للنقل</title>
    <style>
      :root {
        --bg: #F1F5F9;
        --surface: #FFFFFF;
        --text: #0F172A;
        --text-secondary: #475569;
        --border: #E2E8F0;
        --primary: #1D4ED8;
        --primary-hover: #1E40AF;
        --gold: #F59E0B;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background-color: var(--bg);
        color: var(--text);
        font-family: "Tajawal", "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
      }

      .card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 18px 40px -15px rgba(15, 23, 42, 0.14);
        position: relative;
        overflow: hidden;
      }

      .top-bar {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 5px;
        background: var(--primary);
      }

      .logo-wrap {
        width: 76px;
        height: 76px;
        margin: 0 auto 18px;
        border-radius: 20px;
        background: #EFF6FF;
        border: 1px solid #BFDBFE;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: #FEF2F2;
        border: 1px solid #FECACA;
        color: #DC2626;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #DC2626;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 800;
        color: var(--text);
      }

      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.75;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .retry-btn {
        width: 100%;
        min-height: 50px;
        border: none;
        border-radius: 14px;
        background: var(--primary);
        color: #FFFFFF;
        font-family: inherit;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: background-color 0.2s ease, transform 0.15s ease;
      }

      .retry-btn:hover {
        background: var(--primary-hover);
      }

      .retry-btn:active {
        transform: scale(0.99);
      }

      .brand-foot {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        font-weight: 700;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="top-bar"></div>

      <div class="logo-wrap" aria-hidden="true">
        <svg viewBox="0 0 400 300" width="52" height="52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M200 180C140 100 170 50 200 20C230 50 260 100 200 180Z" fill="#F59E0B" />
          <path d="M165 185C100 140 80 80 100 40C130 60 160 100 165 185Z" fill="#FBBF24" />
          <path d="M235 185C300 140 320 80 300 40C270 60 240 100 235 185Z" fill="#FBBF24" />
          <path d="M140 200C80 210 60 240 80 270C110 260 130 220 140 200Z" fill="#2563EB" />
          <path d="M260 200C320 210 340 240 320 270C290 260 270 220 260 200Z" fill="#2563EB" />
        </svg>
      </div>

      <div class="status-badge">
        <span class="status-dot"></span>
        <span>الشبكة غير متاحة</span>
      </div>

      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        تعذّر الوصول إلى خوادم النظام. تتطلب بيانات السندات وحركة الحافلات اتصالاً مباشراً بالإنترنت لضمان دقة البيانات اللحظية.
      </p>

      <button type="button" class="retry-btn" onclick="window.location.reload()">
        <span>إعادة المحاولة</span>
      </button>

      <div class="brand-foot">درة المنورة للنقل • موسم حج 1448هـ</div>
    </main>

    <script>
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
